<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BuzzCast</title>
  <link rel="stylesheet" href="style.css" />
  <script src="lang.js"></script>
</head>
<body class="lobby">
  <img src="buzz-logo.png" class="buzz-logo" alt="BuzzCast" />
  <p class="subtitle" data-i18n="subtitle">Choose your controller</p>
  <div id="slots" class="slot-grid"></div>
  <p id="status" class="status"></p>
  <a href="instructions.html" class="instructions-btn" data-i18n="instructions_btn">Instructions</a>
  <p class="footer">
    <a href="https://github.com/bacoinz/buzzcast" target="_blank">GitHub</a>
    <span class="footer-sep">·</span>
    <span class="lang-switcher">
      <button class="flag-btn" data-lang="en" onclick="setLang('en')" title="English"><svg viewBox="0 0 60 30" width="36" height="18" aria-hidden="true"><clipPath id="uk-s"><path d="M0,0v30h60V0z"/></clipPath><clipPath id="uk-t"><path d="M30,15h30v15zv15H0zH0V0zV0h30z"/></clipPath><g clip-path="url(#uk-s)"><path d="M0,0v30h60V0z" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></g></svg></button>
      <button class="flag-btn" data-lang="pt" onclick="setLang('pt')" title="Português"><svg viewBox="0 0 30 20" width="27" height="18" aria-hidden="true"><rect width="12" height="20" fill="#046a38"/><rect x="12" width="18" height="20" fill="#da291c"/><circle cx="12" cy="10" r="3.6" fill="none" stroke="#ffe900" stroke-width="1.4"/><path d="M10.3 8.2h3.4v2.6a1.7 1.7 0 0 1-3.4 0z" fill="#fff" stroke="#da291c" stroke-width="0.6"/></svg></button>
    </span>
  </p>

  <script>
    applyI18n();

    const PLAYERS = 8;
    const grid = document.getElementById("slots");
    const status = document.getElementById("status");
    status.textContent = t("status_connecting");
    let taken = {};
    let playerNames = {};

    const buttons = [];
    for (let p = 1; p <= PLAYERS; p++) {
      const b = document.createElement("button");
      b.className = "slot-btn";
      b.dataset.player = p;
      b.addEventListener("click", () => choose(p));
      grid.appendChild(b);
      buttons.push(b);
    }

    function render() {
      buttons.forEach((b) => {
        const p = Number(b.dataset.player);
        const isTaken = !!taken[p];
        const name = playerNames[p];
        b.classList.toggle("taken", isTaken);
        b.disabled = isTaken;
        if (isTaken) {
          b.textContent = t("player_taken", p, name);
        } else {
          b.textContent = t("player_slot", p);
        }
      });
    }

    function choose(p) {
      if (taken[p]) return;
      location.href = "controller.html?player=" + p;
    }

    let ws;
    function connect() {
      const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(wsProto + "//" + location.host);
      ws.onopen = () => { status.textContent = t("status_ready"); };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "slots") {
          taken = msg.taken;
          playerNames = msg.names || {};
          render();
        }
      };
      ws.onclose = () => { status.textContent = t("status_lost"); setTimeout(connect, 1000); };
    }
    connect();
  </script>
</body>
</html>
